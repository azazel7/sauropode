#[Backend]
backend = "auto"
transition_mode = "finish_by"

#[Smoothing]
smoothing = true
startup_duration = 0.5
shutdown_duration = 0.5
adaptive_interval = 1

#[Time-based config]
night_temp = 2500            # Warmer for late nights
day_temp = 6500
night_gamma = 85             # Dimmer for comfort
day_gamma = 100
update_interval = 60

#[Clock-based transitions]
sunset = "20:00:00"          # Stay up later
sunrise = "05:20:00"         # Sleep in
transition_duration = 90     # Longer transitions
